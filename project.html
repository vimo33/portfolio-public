<!-- Data first, then render (before script.js so the reveal observer picks up the nodes) -->
<script src="data.js"></script>
<script>
(function renderProject(){
  const root = document.getElementById('caseRoot');
  const id = new URLSearchParams(location.search).get('id');
  const d = (window.PROJECT_DETAILS || {})[id];
  const p = (window.PROJECTS || []).find(x => x.id === id);

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  if (!d || !p){
    root.innerHTML = `<section class="case-hero"><div class="wrap"><div class="case-copy">
      <a href="index.html#work" class="case-back">
        <svg width="32" height="10" viewBox="0 0 32 10" fill="none" aria-hidden="true"><path d="M32 5H4M10 1L4 5l6 4" stroke="currentColor"/></svg>
        All projects</a>
      <h1 class="case-title">Project not found</h1>
      <p class="case-desc">That project doesn't exist yet. Head back to the work index.</p>
    </div></div></section>`;
    return;
  }

  document.title = `${p.title} — Vikas Mohan`;

  const arrow = '<svg viewBox="0 0 40 12" fill="none" aria-hidden="true"><path d="M0 6h36M30 1l6 5-6 5" stroke="currentColor" stroke-width="1"/></svg>';
  const extlink = '<svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2 12L12 2M5 2h7v7" stroke="currentColor"/></svg>';

  const actions = [];
  if (d.live) actions.push(`<a class="btn primary" href="${esc(d.live)}" target="_blank" rel="noopener">Visit live ${extlink}</a>`);
  if (d.repo) actions.push(`<a class="link-arrow" href="${esc(d.repo)}" target="_blank" rel="noopener">View repo ${arrow}</a>`);

  const visual = d.shot
    ? `<div class="case-shot reveal" data-delay="2"><img src="${esc(d.shot)}" alt="${esc(p.title)} — screenshot" loading="lazy" /></div>`
    : `<div class="case-shot case-shot--ph reveal" data-delay="2"><span class="ph-orb" aria-hidden="true"></span><span class="ph-note">${esc(d.status || 'Preview on request')}</span></div>`;

  const points = (d.points && d.points.length)
    ? `<div class="wrap"><ul class="case-points reveal">${d.points.map(pt => `<li>${esc(pt)}</li>`).join('')}</ul></div>` : '';

  const stack = (d.stack && d.stack.length)
    ? `<div class="wrap"><div class="case-stack reveal">${d.stack.map(s => `<span>${esc(s)}</span>`).join('')}</div></div>` : '';

  root.innerHTML = `
    <section class="case-hero">
      <div class="wrap">
        <div class="case-copy">
          <a href="index.html#work" class="case-back">
            <svg width="32" height="10" viewBox="0 0 32 10" fill="none" aria-hidden="true"><path d="M32 5H4M10 1L4 5l6 4" stroke="currentColor"/></svg>
            All projects
          </a>
          <span class="case-num reveal">${esc(d.num || p.n)}</span>
          <h1 class="case-title reveal" data-delay="1">${esc(p.title)}</h1>
          <div class="case-sub reveal" data-delay="2">${esc(p.sub)}</div>
          <p class="case-desc reveal" data-delay="3">${esc(d.overview)}</p>
          ${actions.length ? `<div class="case-actions reveal" data-delay="4">${actions.join('')}</div>` : ''}
          <div class="case-meta reveal" data-delay="5">
            <div><div class="lbl">Role</div><div class="val">${esc(d.role)}</div></div>
            <div><div class="lbl">Year</div><div class="val">${esc(d.year)}</div></div>
            <div><div class="lbl">Status</div><div class="val">${esc(d.status)}</div></div>
            <div><div class="lbl">Team</div><div class="val">${esc(d.team)}</div></div>
          </div>
        </div>
        ${visual}
      </div>
    </section>
    ${points}
    ${stack}
  `;
})();
</script>
<script src="script.js"></script>
